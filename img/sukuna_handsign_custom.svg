<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 55 420 450" width="100%" height="100%">
<defs>
  <filter id="hand-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8" result="blur" />
    <feColorMatrix type="matrix" values="
      0.8 0 0 0 0.8
      0 0.1 0 0 0.1
      0 0 0.8 0 0.8
      0 0 0 1.5 0" result="glow" />
    <feMerge>
      <feMergeNode in="glow" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>

  <filter id="hand-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.85" />
  </filter>

  <!-- Anime Skin Shading: Highlights, Base, Shadow, Crease -->
  <linearGradient id="skin-light" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#faebd7" />
    <stop offset="40%" stop-color="#edd2c0" />
    <stop offset="80%" stop-color="#dfb79f" />
    <stop offset="100%" stop-color="#be8c72" />
  </linearGradient>

  <linearGradient id="skin-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#cf9f83" />
    <stop offset="50%" stop-color="#ab775c" />
    <stop offset="100%" stop-color="#693b23" />
  </linearGradient>

  <!-- Sukuna's Black Cursed Ink Tattoos -->
  <linearGradient id="sukuna-ink" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#1f0f14" />
    <stop offset="50%" stop-color="#080204" />
    <stop offset="100%" stop-color="#000000" />
  </linearGradient>
</defs>
